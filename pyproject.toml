[project]
name = "disrated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imagehash>=4.3.2",
    "nudenet>=3.4.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "scikit-learn>=1.6.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
]

[project.scripts]
disrated = "disrated:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
